# SEALED workspace with its own lockfile — this `pnpm-workspace.yaml` stops a
# `pnpm install` here from being absorbed into the repo's root workspace.
packages:
  - .

strictPeerDependencies: false
autoInstallPeers: true
shamefullyHoist: true
verifyDepsBeforeRun: false

# Install this repo's own DevTools from the tarballs built by
# `../scripts/pack-local.mjs` (run via `pnpm run setup`). `pnpm pack` rewrote
# `@nuxt/devtools`'s `@nuxt/devtools-kit` `workspace:*` dep into a concrete
# version, so redirect that inter-package dependency to its tarball too.
# Everything else (nuxt, vite, @vitejs/devtools, ...) resolves from the registry.
overrides:
  '@nuxt/devtools': file:.tarballs/nuxt-devtools.tgz
  '@nuxt/devtools-kit': file:.tarballs/nuxt-devtools-kit.tgz

allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  vue-demi: true

minimumReleaseAgeExclude:
  - '@devframes/hub-ui@0.9.16'
  - '@devframes/hub@0.9.16'
  - '@devframes/json-render-ui@0.9.16'
  - '@devframes/json-render@0.9.16'
  - '@devframes/plugin-code-server@0.9.16'
  - '@devframes/plugin-data-inspector@0.9.16'
  - '@devframes/plugin-inspect@0.9.16'
  - '@devframes/plugin-messages@0.9.16'
  - '@devframes/plugin-terminals@0.9.16'
  - '@devframes/service-open@0.9.16'
  - '@devframes/vite@0.9.16'
  - '@vitejs/devtools-kit@0.7.3'
  - '@vitejs/devtools@0.7.3'
  - devframe@0.9.16
  - pkg-types@2.3.3
