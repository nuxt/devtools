# SEALED workspace with its own lockfile — this `pnpm-workspace.yaml` stops a
# `pnpm install` here from being absorbed into the repo's root workspace.
packages:
  - .

strictPeerDependencies: false
autoInstallPeers: true
shamefullyHoist: true
verifyDepsBeforeRun: false

# Install this repo's own DevTools from the tarballs built by
# `../scripts/pack-local.mjs` (run via `pnpm run setup`). `pnpm pack` rewrote
# `@nuxt/devtools`'s `@nuxt/devtools-kit` `workspace:*` dep into a concrete
# version, so redirect that inter-package dependency to its tarball too.
# Everything else (nuxt, vite, @vitejs/devtools, ...) resolves from the registry.
overrides:
  '@nuxt/devtools': file:.tarballs/nuxt-devtools.tgz
  '@nuxt/devtools-kit': file:.tarballs/nuxt-devtools-kit.tgz
  # Vite 8.3+ auto-registers the Vite DevTools integration from the `devtools`
  # config option (vitejs/vite#23333) — this playground exercises that path
  # (nuxt4/ stays on the pre-8.3 manual-plugin fallback).
  vite: ^8.3.0

allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  vue-demi: true

minimumReleaseAgeExclude:
  - '@devframes/agentic@1.0.0'
  - '@devframes/hub-ui@1.0.0'
  - '@devframes/hub@1.0.0'
  - '@devframes/json-render-ui@1.0.0'
  - '@devframes/json-render@1.0.0'
  - '@devframes/plugin-code-server@1.0.0'
  - '@devframes/plugin-data-inspector@1.0.0'
  - '@devframes/plugin-inspect@1.0.0'
  - '@devframes/plugin-messages@1.0.0'
  - '@devframes/plugin-terminals@1.0.0'
  - '@devframes/service-open@1.0.0'
  - '@devframes/vite@1.0.0'
  - '@vitejs/devtools-kit@0.7.5'
  - '@vitejs/devtools@0.7.5'
  - devframe@1.0.0
  - '@types/node@26.6.1'
