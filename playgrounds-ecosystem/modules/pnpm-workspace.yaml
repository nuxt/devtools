packages:
  - .

strictPeerDependencies: false
autoInstallPeers: true
shamefullyHoist: true

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true

minimumReleaseAgeExclude:
  - '@nuxt/scripts@1.3.1'

# Keep this sealed workspace on the same Vite/Vue the rest of the repo pins.
# The linked `@nuxt/devtools` pulls `@vitejs/devtools@0.4.9`, which only works
# on Vite 8.0.x — Nuxt's own default (Vite 7) makes it eagerly fail to resolve
# `@vitejs/devtools-rolldown` at dev-server startup. Mirror the root
# pnpm-workspace.yaml refs so DevTools boots here too.
overrides:
  vite: ~8.0.16
  vue: ^3.5.40
  '@vue/compiler-core': ^3.5.40
  '@vue/compiler-dom': ^3.5.40
  '@vue/shared': ^3.5.40

catalog:
  '@compodium/nuxt': ^0.1.0-beta.13
  '@nuxt/a11y': ^1.0.0-alpha.1
  '@nuxt/content': ^3.15.0
  '@nuxt/devtools': ^4.0.0-alpha.7
  '@nuxt/eslint': ^1.16.0
  '@nuxt/fonts': ^0.14.0
  '@nuxt/hints': ^1.1.4
  '@nuxt/image': ^2.0.0
  '@nuxt/scripts': ^1.3.1
  '@scalar/nuxt': ^0.6.59
  '@types/node': ^26.1.1
  eslint: ^9.0.0
  nuxt: ^4.5.0
  nuxt-og-image: ^6.7.2
