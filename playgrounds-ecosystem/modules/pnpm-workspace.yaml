packages:
  - .
  - legacy-kit-v3

strictPeerDependencies: false
autoInstallPeers: true
shamefullyHoist: true

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true

minimumReleaseAgeExclude:
  - '@nuxt/scripts@1.3.1'

catalog:
  '@compodium/nuxt': ^0.1.0-beta.13
  '@nuxt/a11y': ^1.0.0-alpha.1
  '@nuxt/content': ^3.15.0
  '@nuxt/eslint': ^1.16.0
  '@nuxt/fonts': ^0.14.0
  '@nuxt/hints': ^1.1.4
  '@nuxt/image': ^2.0.0
  '@nuxt/scripts': ^1.3.1
  '@scalar/nuxt': ^0.6.59
  '@types/node': ^26.1.1
  eslint: ^9.0.0
  nuxt: ^4.5.1
  nuxt-og-image: ^6.7.2
