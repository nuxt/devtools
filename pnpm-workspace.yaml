  '@devframes/plugin-messages': *devframe
  '@devframes/plugin-terminals': *devframe
  '@nuxt/devtools': workspace:*
  '@nuxt/kit': &nuxt-kit npm:@nuxt/kit-nightly@5.0.0-29806258.d070492f
  '@nuxt/schema': &nuxt-schema npm:@nuxt/schema-nightly@5.0.0-29806258.d070492f
  '@vitejs/devtools': &vite-devtools ^0.7.5
  '@vitejs/devtools-kit': *vite-devtools
  '@vue/compiler-core': &vue ^3.5.42
  '@vue/compiler-dom': *vue
  '@vue/shared': *vue
  '@vueuse/core': &vueuse ^14.4.0
  chokidar: ^5.0.0
  devframe: *devframe
  esbuild: ^0.28.2
  markdown-exit: ^1.3.0
