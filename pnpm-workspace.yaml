ignoreWorkspaceRootCheck: true
strictPeerDependencies: false
autoInstallPeers: true
minimumReleaseAgeExclude:
  - '@devframes/hub'
  - '@devframes/json-render'
  - '@devframes/plugin-data-inspector'
  - '@devframes/plugin-code-server'
  - '@devframes/plugin-inspect'
  - '@devframes/plugin-messages'
  - '@devframes/plugin-terminals'
  - '@vitejs/devtools-kit'
  - '@vitejs/devtools-rolldown'
  - '@vitejs/devtools'
  - devframe
  - verkit@0.1.2
  - vite-plugin-inspect@12.0.2
resolutionMode: highest
shamefullyHoist: true
shellEmulator: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - 'tinyexec@1.2.0 || 1.2.1 || 1.2.2'

packages:
  - packages/**
  - playgrounds/**
  - '!playgrounds/**/.output/**'

allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  json-editor-vue: true
  simple-git-hooks: true
  unrs-resolver: true
  vue-demi: true

refs:
  devframe: &devframe ^0.8.0
  # Nuxt 5 nightly. Its own `@nuxt/vite-builder-nightly` already requires
  # `vite@^8.1.5`, so this and the `vite` ref below move together.
  #
  # Pinned to the exact snapshot instead of floating on `5x`: with
  # `resolutionMode: highest` (below), *any* lockfile-affecting change
  # anywhere in the workspace — not just to these refs — makes pnpm
  # re-resolve every floating range to the newest match, including this one.
  # The next snapshot available at the time this was pinned
  # (nuxt-nightly@5.0.0-29760455.e6509fdd) fails to build: the SSR/Nitro
  # build errors on `packages/devtools/client/components/docs/*.md` with
  # "At least one <template> or <script> is required in a single file
  # component" — `unplugin-vue-markdown`'s transform isn't applying for that
  # environment on that snapshot. Bumping past this pin is tracked as its
  # own follow-up (see the repo's other dedicated `deps/nuxt5-nightly-*`
  # PRs) once that regression is understood; don't bump it as a drive-by of
  # an unrelated change.
  nuxt: &nuxt npm:nuxt-nightly@5.0.0-29755283.b4586ef2
  nuxt-kit: &nuxt-kit npm:@nuxt/kit-nightly@5.0.0-29755283.b4586ef2
  nuxt-schema: &nuxt-schema npm:@nuxt/schema-nightly@5.0.0-29755283.b4586ef2
  shiki: &shiki ^4.4.1
  unocss: &unocss ^66.7.5
  vite: &vite ^8.2.0
  vite-devtools: &vite-devtools ^0.4.11
  vue: &vue ^3.5.40
  vueuse: &vueuse ^14.4.0
overrides:
  '@devframes/hub': *devframe
  '@devframes/json-render': *devframe
  '@devframes/plugin-code-server': *devframe
  '@devframes/plugin-data-inspector': *devframe
  '@devframes/plugin-inspect': *devframe
  '@devframes/plugin-messages': *devframe
  '@devframes/plugin-terminals': *devframe
  '@nuxt/devtools': workspace:*
  '@vue/compiler-core': *vue
  '@vue/compiler-dom': *vue
  '@vue/shared': *vue
  chokidar: ^5.0.0
  devframe: *devframe
  esbuild: ^0.28.1
  # `unplugin-vue-markdown@32.0.0` depends on its own `markdown-exit
  # ^1.0.0-beta.9`, a different prerelease tuple than the `^1.1.0-beta.2`
  # `packages/devtools` depends on directly — semver won't let one satisfy
  # the other, so without this override pnpm resolves and ships two copies
  # of the engine. Force both onto the version this workspace uses directly.
  markdown-exit: ^1.1.0-beta.2
  rollup: ^4.62.4
  semver: ^7.8.5
  typescript: ^6.0.3
  unimport: ^6.4.0
  vite: *vite
  vue: *vue
  # `@nuxt/module-builder@1.0.3` bundles `mkdist@2.4.1`, whose own
  # `vue-sfc-transformer` dependency is pinned to `^0.1.17` — but
  # `resolutionMode: highest` otherwise hoists mkdist's copy up to
  # `@nuxt/module-builder`'s own newer `^0.2.3` want, and mkdist's `.vue`
  # transform silently breaks under that mismatch (it wrote compiled output
  # into `packages/devtools/src/runtime/**` instead of `dist/`, clobbering
  # `auth/index.html` in the process). Pin to what mkdist itself needs.
  vue-sfc-transformer: ^0.2.5
  vue-tsc: ^3.3.9
catalogs:
  buildtools:
    '@nuxt/module-builder': ^1.0.3
    '@parcel/watcher': ^2.6.0
    '@unocss/core': *unocss
    '@unocss/eslint-config': *unocss
    '@unocss/nuxt': *unocss
    '@unocss/preset-attributify': *unocss
    '@unocss/preset-icons': *unocss
    '@unocss/preset-mini': *unocss
    '@unocss/preset-uno': *unocss
    '@vitejs/devtools': *vite-devtools
    '@vueuse/nuxt': *vueuse
    exsolve: ^1.1.1
    lightningcss: ^1.33.0
    # Nuxt 5 nightly's Nitro layer (`@nuxt/nitro-server-nightly`) builds on
    # the next-gen Nitro v3 engine (package `nitro`, not `nitropack`).
    # `@nuxt/devtools`/`@nuxt/devtools-kit` declare both as *optional* peer
    # dependencies (a consumer's Nuxt has exactly one or the other), but
    # still pin a devDependency here too so this monorepo's own build and
    # typecheck resolve a single, consistent version of each rather than
    # whatever `autoInstallPeers` would otherwise pick independently.
    nitro: ^3.0.260610-beta
    nitropack: ^2.13.4
    nuxt: *nuxt
    shiki-codegen: *shiki
    skills-npm: ^1.2.0
    turbo: ^2.10.8
    unbuild: ^3.6.1
    unocss: *unocss
    unplugin-vue: ^7.2.0
    unplugin-vue-markdown: ^32.0.0
  cli:
    '@antfu/eslint-config': ^9.2.0
    '@antfu/ni': ^30.3.0
    '@nuxt/eslint': ^1.16.0
    '@nuxt/test-utils': ^4.1.0
    '@playwright/test': ^1.62.1
    bumpp: ^12.1.1
    eslint: ^10.8.0
    eslint-flat-config-utils: ^3.2.0
    eslint-plugin-antfu: ^3.2.3
    eslint-plugin-format: ^2.0.1
    eslint-typegen: ^2.3.1
    knip: ^6.31.0
    nano-staged: ^1.0.2
    nuxt-eslint-auto-explicit-import: ^0.2.0
    simple-git-hooks: ^2.13.1
    taze: ^19.16.0
    tsx: ^4.23.5
    typescript: ^6.0.3
    vitest: ^4.1.10
    vue-tsc: ^3.3.9
  frontend:
    '@antfu/utils': ^9.3.0
    '@unocss/reset': *unocss
    '@unocss/runtime': *unocss
    '@vueuse/core': *vueuse
    '@vueuse/integrations': *vueuse
    birpc: ^4.0.0
    cronstrue: ^3.24.0
    diff: ^9.0.0
    error-stack-parser-es: ^2.0.1
    floating-vue: ^5.2.2
    focus-trap: ^8.2.2
    fuse.js: ^7.5.0
    hookable: ^6.1.1
    json-editor-vue: ^0.19.1
    markdown-exit: ^1.1.0-beta.2
    markdown-it-link-attributes: ^4.0.1
    ofetch: ^1.5.1
    ohash: ^2.0.11
    pathe: ^2.0.3
    perfect-debounce: ^2.1.0
    quicktype-core: 22.0.0
    scule: ^1.3.0
    shiki: *shiki
    splitpanes: ^4.1.2
    structured-clone-es: ^2.0.1
    theme-vitesse: ^1.0.0
    ua-parser-modern: ^0.1.1
    v-lazy-show: ^0.3.0
    vanilla-jsoneditor: ^3.13.0
    vis-data: ^8.0.4
    vis-network: ^10.1.0
    vite-hot-client: ^2.2.0
    vue: *vue
    vue-router: ^5.2.0
    vue-virtual-scroller: ^3.0.4
  icons:
    '@iconify-json/bxl': ^1.2.4
    '@iconify-json/carbon': ^1.2.25
    '@iconify-json/logos': ^1.2.11
    '@iconify-json/ph': ^1.2.2
    '@iconify-json/ri': ^1.2.10
    '@iconify-json/simple-icons': ^1.2.92
    '@iconify-json/tabler': ^1.2.38
  inlined:
    package-manager-detector: ^1.8.0
  prod:
    '@devframes/plugin-code-server': *devframe
    '@devframes/plugin-data-inspector': *devframe
    '@nuxt/kit': *nuxt-kit
    consola: ^3.4.2
    defu: ^6.1.7
    destr: ^2.0.5
    fast-npm-meta: ^2.2.0
    image-meta: ^0.2.2
    launch-editor: ^2.14.1
    local-pkg: ^1.2.1
    magicast: ^0.5.4
    nostics: ^1.2.0
    pkg-types: ^2.3.1
    sirv: ^3.0.2
    tinyexec: ^1.3.0
    tinyglobby: ^0.2.17
    verkit: ^0.3.1
    vite-plugin-inspect: ^12.0.2
    vite-plugin-vue-tracer: ^1.4.0
    ws: ^8.21.1
  types:
    '@nuxt/schema': *nuxt-schema
    '@types/markdown-it-link-attributes': ^3.0.5
    '@types/node': ^26.1.2
    '@types/ws': ^8.18.1
    '@unhead/schema': ^3.2.3
    '@vitejs/devtools-kit': *vite-devtools
    unimport: ^6.4.0

update:
  ignoreDeps:
    - typescript@7
