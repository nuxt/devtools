ignoreWorkspaceRootCheck: true
minimumReleaseAgeExcludePrune: true
resolutionMode: highest

trustPolicy: no-downgrade
trustPolicyExclude:
  # cssnano 9.x (pulled in by nuxt 4.6) is published by the same trusted publisher,
  # just without the staged-publish approver 8.x had, which pnpm flags as a downgrade
  - cssnano-preset-default@9.8.0
  - cssnano-utils@9.0.0
  - cssnano@9.8.0
  - postcss-colormin@9.0.8
  - postcss-convert-values@9.1.0
  - postcss-discard-comments@9.0.8
  - postcss-discard-duplicates@9.0.7
  - postcss-discard-empty@9.0.8
  - postcss-discard-overridden@9.0.6
  - postcss-merge-longhand@9.4.0
  - postcss-merge-rules@9.1.5
  - postcss-minify-font-values@9.0.9
  - postcss-minify-gradients@9.0.8
  - postcss-minify-params@9.1.0
  - postcss-minify-selectors@9.0.8
  - postcss-normalize-charset@9.0.6
  - postcss-normalize-display-values@9.0.7
  - postcss-normalize-positions@9.0.8
  - postcss-normalize-repeat-style@9.0.7
  - postcss-normalize-string@9.0.7
  - postcss-normalize-timing-functions@9.0.7
  - postcss-normalize-unicode@9.1.1
  - postcss-normalize-url@10.0.0
  - postcss-normalize-whitespace@9.0.8
  - postcss-ordered-values@9.0.9
  - postcss-reduce-initial@9.0.7
  - postcss-reduce-transforms@9.0.6
  - postcss-unique-selectors@9.0.6
  - stylehacks@9.0.8

autoInstallPeers: true
strictPeerDependencies: false
shamefullyHoist: true
shellEmulator: true

packages:
  - packages/**
  - playgrounds/**

overrides:
  '@nuxt/devtools': workspace:*
  chokidar: catalog:buildtools
  esbuild: catalog:buildtools
  mkdist: catalog:buildtools
  rollup: catalog:buildtools
  semver: catalog:prod
  structured-clone-es: catalog:frontend
  typescript: catalog:cli
  unimport: catalog:types
  vite: catalog:buildtools
  vue-tsc: catalog:cli

allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  cypress: true
  esbuild: true
  json-editor-vue: true
  simple-git-hooks: true
  unrs-resolver: true
  vue-demi: true

