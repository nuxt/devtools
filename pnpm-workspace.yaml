    - typescript@7

autoInstallPeers: true
strictPeerDependencies: false
shamefullyHoist: true
shellEmulator: true

packages:
  - packages/**
  - '!packages/*/package'
  - '!packages/*/package/**'
  - playgrounds/**
  - '!playgrounds/**/.output/**'

overrides:
  '@devframes/hub': &devframe ^1.0.0
  '@devframes/json-render': *devframe
  '@devframes/plugin-code-server': *devframe
  '@devframes/plugin-data-inspector': *devframe
