name: docs-screenshots

# Regenerates the screenshots in `docs/images/` (`pnpm docs:screenshots`) and
# opens a pull request when they changed. Run it from the Actions tab after a
# UI change; one runner keeps the rendering consistent across runs.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    if: github.repository == 'nuxt/devtools'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: npm install -g corepack@latest
      - run: corepack enable
      - run: pnpm install
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm docs:screenshots
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.ref_name }}
          BRANCH: docs/screenshots-${{ github.run_id }}
        run: |
          if [ -z "$(git status --porcelain -- docs/images)" ]; then
            echo "Screenshots are up to date."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add docs/images
          git commit -m 'docs: update screenshots'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          gh pr create --base "$BASE" --head "$BRANCH" \
            --title 'docs: update screenshots' \
            --body "Regenerated by \`pnpm docs:screenshots\` in the [docs-screenshots workflow](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
